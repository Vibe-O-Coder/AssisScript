name: Native language checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Native debug test dependency
        run: sudo apt-get update && sudo apt-get install -y gdb binutils libcurl4
      - name: Rebuild runtimes and compiler from source
        run: python3 tools/embed-runtime.py && make -B all
      - run: |
          mkdir -p build/review-tests
          set -o pipefail
          make test test-pe test-dev test-evolution test-generics test-functions test-generic-classes test-collections-ast test-ownership-functions test-values test-files test-text-bytes test-cli test-alpha8 test-alpha9 test-alpha10 test-alpha11 test-alpha12 test-alpha13 test-usability test-alpha15 2>&1 | tee build/review-tests/native-linux.log
      - name: Record current native and example validation
        run: python3 tools/test-native.py --output build/review-tests/linux-release.json && python3 tools/validate-examples.py --output build/review-tests/examples-linux.json
      - name: Validate host and all x86_64 output formats
        run: python3 tools/test-portability.py --expect-host x86_64 --output build/review-tests/ports-linux-x64.json
      - run: python3 tools/benchmark-optimization.py --samples 3 --output benchmarks/resultados/optimization-alpha15-linux.json --check
      - run: python3 tools/benchmark-backend.py --samples 3 --output benchmarks/resultados/backend-alpha15-linux.json
      - run: python3 tools/soak-native.py --duration 120 --workers 4 --polling --output benchmarks/resultados/soak-alpha15-short-linux.json --status-output build/review-tests/soak-short-linux.status.json
      - run: python3 tools/report-progress.py --check
      - run: python3 tools/generate-install-manifest.py --check
      - run: python3 tools/audit-build.py --output docs/build-audit-linux.json
      - run: python3 tools/audit-build.py --check --output docs/build-audit-linux.json
      - run: python3 tools/validate-clean.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-validation
          path: |
            build/review-tests/linux-release.json
            build/review-tests/examples-linux.json
            build/review-tests/native-linux.log
            build/review-tests/ports-linux-x64.json
            build/clean-linux.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-values-io-measurement
          path: |
            benchmarks/resultados/backend-alpha15-linux.*
            benchmarks/resultados/optimization-alpha15-linux.*
            benchmarks/resultados/soak-alpha15-short-linux.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: bin/assis
      - uses: actions/upload-artifact@v4
        with:
          name: link-audit-linux
          path: docs/build-audit-linux.json
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        id: toolchain
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-curl
      - name: Rebuild runtimes and compiler from source
        shell: pwsh
        env:
          ASSIS_MSYS2: ${{ steps.toolchain.outputs.msys2-location }}
        run: |
          $toolchainBin = Join-Path $env:ASSIS_MSYS2 'ucrt64/bin'
          $env:PATH = $toolchainBin + ';' + $env:PATH
          $env:BINUTILS_DIR = $toolchainBin
          "ASSIS_TOOLCHAIN_BIN=$toolchainBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python tools/embed-runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'Runtime rebuild failed' }
          ./tools/build-windows.ps1 -Compiler (Join-Path $toolchainBin 'gcc.exe')
      - name: Native compiler, editor and functional tests
        shell: pwsh
        run: |
          $env:ASSIS_CURL_BIN = $env:ASSIS_TOOLCHAIN_BIN
          New-Item -ItemType Directory -Path build/review-tests -Force | Out-Null
          ./tests/test-windows.ps1 6>&1 | Tee-Object -FilePath build/review-tests/native-windows.log
          node --test --test-isolation=none tests/test-development.js tests/test-v3.js tests/test-v31.js tests/test-v32.js tests/test-lsp.js vscode-assisscript/test/language.test.js vscode-assisscript/test/extension.test.js *> build/review-tests/node-windows.log
          if ($LASTEXITCODE -ne 0) { throw 'Node tests failed' }
          python tests/test-evolution.py
          if ($LASTEXITCODE -ne 0) { throw 'Evolution tests failed' }
          python tests/test-generics.py
          if ($LASTEXITCODE -ne 0) { throw 'Generics tests failed' }
          python tests/test-functions.py
          if ($LASTEXITCODE -ne 0) { throw 'Function tests failed' }
          python tests/test-generic-classes.py
          if ($LASTEXITCODE -ne 0) { throw 'Generic class tests failed' }
          python tests/test-collections-ast.py
          if ($LASTEXITCODE -ne 0) { throw 'Collections AST tests failed' }
          python tests/test-ownership-functions.py
          if ($LASTEXITCODE -ne 0) { throw 'Ownership function tests failed' }
          foreach ($suite in @('values','files','text-bytes','cli','numbers','packages','json','system','tooling','slices','managed-classes','backend-alpha9','optimization','english-api','release-policy','ffi','http','process','applications-bc','safe-default','net','move-enums','closures','usability','backend-evolution')) {
            python ('tests/test-' + $suite + '.py')
            if ($LASTEXITCODE -ne 0) { throw ('New suite failed: ' + $suite) }
          }
          python tools/test-native.py --output build/review-tests/windows-release.json
          if ($LASTEXITCODE -ne 0) { throw 'Native validation failed' }
          python tools/validate-examples.py --output build/review-tests/examples-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'Example validation failed' }
          python tools/test-portability.py --expect-host x86_64 --output build/review-tests/ports-windows-x64.json
          if ($LASTEXITCODE -ne 0) { throw 'Host/output portability validation failed' }
          python tools/benchmark-optimization.py --samples 3 --output benchmarks/resultados/optimization-alpha15-windows.json --check
          if ($LASTEXITCODE -ne 0) { throw 'Performance regression gate failed' }
          python tools/benchmark-backend.py --samples 3 --output benchmarks/resultados/backend-alpha15-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'Backend equivalence measurement failed' }
          python tools/soak-native.py --duration 120 --workers 4 --polling --output benchmarks/resultados/soak-alpha15-short-windows.json --status-output build/review-tests/soak-short-windows.status.json
          if ($LASTEXITCODE -ne 0) { throw 'Short soak failed' }
          python tools/generate-install-manifest.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Install manifest differs from distribution' }
          python tools/report-progress.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Progress report differs from checklist' }
          python tools/audit-build.py --cc (Join-Path $env:ASSIS_TOOLCHAIN_BIN 'gcc.exe') --output docs/build-audit-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'Link inventory failed' }
          python tools/validate-clean.py --cc (Join-Path $env:ASSIS_TOOLCHAIN_BIN 'gcc.exe') --binutils-dir $env:ASSIS_TOOLCHAIN_BIN
          if ($LASTEXITCODE -ne 0) { throw 'Clean rebuild failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-values-io-measurement
          path: |
            benchmarks/resultados/backend-alpha15-windows.*
            benchmarks/resultados/optimization-alpha15-windows.*
            benchmarks/resultados/soak-alpha15-short-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: bin/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: link-audit-windows
          path: docs/build-audit-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          path: |
            build/review-tests/windows-release.json
            build/review-tests/examples-windows.json
            build/review-tests/native-windows.log
            build/review-tests/node-windows.log
            build/review-tests/ports-windows-x64.json
            build/clean-win32.json
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make -B all CC=clang
      - name: Execute safe language regressions on macOS
        run: python3 tests/test-usability.py
      - run: python3 tests/test-files.py
      - run: python3 tests/test-system.py
      - run: python3 tests/test-slices.py
      - run: python3 tests/test-closures.py
      - run: python3 tests/test-backend-evolution.py
      - run: bin/assis run exemplos/31_language_review.assis --debug
      - name: Record native macOS host and output validation
        run: python3 tools/test-portability.py --expect-host x86_64 --output build/review-tests/ports-macos-x64.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-x64-validation
          path: build/review-tests/ports-macos-x64.json
  arm-hosts:
    name: ${{ matrix.name }} compiler host / x86_64 output
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64 (QEMU)
            runner: ubuntu-24.04-arm
            execution: qemu
            artifact: linux-arm64-host
            cc: gcc
          - name: macOS ARM64 (Rosetta)
            runner: macos-15
            execution: rosetta
            artifact: macos-arm64-host
            cc: clang
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install explicit x86_64 output emulator on Linux ARM64
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Check Rosetta execution on Apple Silicon
        if: runner.os == 'macOS'
        run: /usr/bin/arch -x86_64 /usr/bin/true
      - name: Build the compiler for the native ARM64 host
        # Embedded runtimes are x86_64 byte arrays. The x64 jobs regenerate them.
        run: make -B all CC=${{ matrix.cc }}
      - name: Validate native frontend, cross compilation and emulated outputs
        run: python3 tools/test-portability.py --expect-host arm64 --execution ${{ matrix.execution }} --output build/review-tests/${{ matrix.artifact }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}-validation
          path: build/review-tests/${{ matrix.artifact }}.json
  package:
    needs: [linux, windows, macos, arm-hosts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: bin
      - run: chmod +x bin/assis
      - uses: actions/download-artifact@v4
        with:
          name: linux-values-io-measurement
          path: benchmarks/resultados
      - uses: actions/download-artifact@v4
        with:
          name: windows-values-io-measurement
          path: benchmarks/resultados
      - uses: actions/download-artifact@v4
        with:
          name: link-audit-linux
          path: docs
      - uses: actions/download-artifact@v4
        with:
          name: link-audit-windows
          path: docs
      - uses: actions/download-artifact@v4
        with:
          name: linux-validation
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: windows-validation
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: macos-x64-validation
          path: build/review-tests
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64-host-validation
          path: build/review-tests
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-host-validation
          path: build/review-tests
      - run: python3 tools/write-validation.py
      - run: python3 tools/package-vscode.py && python3 tools/package-release.py && python3 tools/verify-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-packages
          path: dist/*
