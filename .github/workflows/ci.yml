name: Native language checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Native debug test dependency
        run: sudo apt-get update && sudo apt-get install -y gdb binutils
      - name: Rebuild runtimes and compiler from source
        run: python3 tools/embed-runtime.py && make -B all
      - run: make test test-pe test-dev test-evolution test-generics test-functions test-generic-classes test-collections-ast test-ownership-functions test-values test-files test-text-bytes test-cli test-alpha8 test-alpha9
      - run: python3 tools/report-progress.py --check
      - run: python3 tools/generate-install-manifest.py --check
      - run: python3 tools/validate-clean.py
      - run: python3 tools/benchmark-alpha9.py --samples 3 --iterations 2000000 --output benchmarks/resultados/evolucao-alpha9-linux.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-values-io-measurement
          path: benchmarks/resultados/evolucao-alpha9-linux.*
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: bin/assis
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Rebuild runtimes and compiler from source
        shell: pwsh
        run: |
          $env:PATH = 'C:\msys64\ucrt64\bin;' + $env:PATH
          $env:BINUTILS_DIR = 'C:\msys64\ucrt64\bin'
          python tools/embed-runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'Runtime rebuild failed' }
          ./tools/build-windows.ps1 -Compiler C:/msys64/ucrt64/bin/gcc.exe
      - name: Native compiler, editor and functional tests
        shell: pwsh
        run: |
          ./tests/test-windows.ps1
          node --test --test-isolation=none tests/test-development.js tests/test-v3.js tests/test-v31.js tests/test-v32.js tests/test-lsp.js vscode-assisscript/test/language.test.js vscode-assisscript/test/extension.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Node tests failed' }
          python tests/test-evolution.py
          if ($LASTEXITCODE -ne 0) { throw 'Evolution tests failed' }
          python tests/test-generics.py
          if ($LASTEXITCODE -ne 0) { throw 'Generics tests failed' }
          python tests/test-functions.py
          if ($LASTEXITCODE -ne 0) { throw 'Function tests failed' }
          python tests/test-generic-classes.py
          if ($LASTEXITCODE -ne 0) { throw 'Generic class tests failed' }
          python tests/test-collections-ast.py
          if ($LASTEXITCODE -ne 0) { throw 'Collections AST tests failed' }
          python tests/test-ownership-functions.py
          if ($LASTEXITCODE -ne 0) { throw 'Ownership function tests failed' }
          foreach ($suite in @('values','files','text-bytes','cli','numbers','packages','json','system','tooling','slices','managed-classes','backend-alpha9')) {
            python ('tests/test-' + $suite + '.py')
            if ($LASTEXITCODE -ne 0) { throw ('New suite failed: ' + $suite) }
          }
          python tools/generate-install-manifest.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Install manifest differs from distribution' }
          python tools/report-progress.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Progress report differs from checklist' }
          python tools/validate-clean.py --cc C:/msys64/ucrt64/bin/gcc.exe --binutils-dir C:/msys64/ucrt64/bin
          if ($LASTEXITCODE -ne 0) { throw 'Clean rebuild failed' }
          python tools/benchmark-alpha9.py --samples 3 --output benchmarks/resultados/evolucao-alpha9-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'Ownership measurement failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-values-io-measurement
          path: benchmarks/resultados/evolucao-alpha9-windows.*
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: bin/*.exe
  package:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: bin
      - run: chmod +x bin/assis
      - uses: actions/download-artifact@v4
        with:
          name: linux-values-io-measurement
          path: benchmarks/resultados
      - uses: actions/download-artifact@v4
        with:
          name: windows-values-io-measurement
          path: benchmarks/resultados
      - run: python3 tools/package-vscode.py && python3 tools/package-release.py && python3 tools/verify-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-packages
          path: dist/*
